ux_icons:
  aliases:
    Wine: lucide:wine
    Marvel: openmoji:superhero
    Car: mdi:car
    layout-grid: tabler:layout-grid
  default_icon_attributes:
    width: 16px
    height: 16px
    fill: currentColor
  iconify:
    enabled: true
    on_demand: false
  ignore_not_found: false

# Locked/vendored icons in prod (reliability, no runtime dependency on Iconify);
# on_demand in dev so a missing icon fetches automatically instead of a 500,
# without needing to remember `ux:icons:lock` after every new icon reference.
when@dev:
    ux_icons:
        iconify:
            on_demand: true
