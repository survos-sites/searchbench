api_platform:
    title: Hello API Platform
    version: 1.0.0
    defaults:
        stateless: true
        cache_headers:
            vary: ['Content-Type', 'Authorization', 'Origin']
    meilisearch:
        enabled: true
        url: '%env(MEILI_SERVER)%'
        api_key: '%env(MEILI_API_KEY)%'
